name: Vérifier

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # Ce nom est celui du check exigé par la protection de la branche main. Aucun secret ici.
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils (Rokit)
        uses: ./.github/actions/outils

      - name: Installer les dépendances Wally
        run: wally install

      # La bibliothèque standard « roblox » de Selene n'est pas dans le dépôt : on la génère explicitement.
      - name: Bibliothèque standard Roblox pour Selene
        run: selene generate-roblox-std

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # La même commande qu'en local : format, lint, types (seule étape qui vérifie `--!strict`), tests Node et Lune,
      # génération, carte commitée = carte générée, tous les contrôles de carte, cartes cassées (chacune doit faire
      # échouer son contrôle), construction Rojo. S'arrête au premier échec et dit lequel.
      - name: Tout vérifier
        run: node outils/tout-verifier.mjs
