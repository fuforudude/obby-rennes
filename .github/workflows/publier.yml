name: Publier

on:
  push:
    branches: [main]

permissions:
  contents: read

# Une publication en cours n'est jamais annulée. Chaque cible a son propre groupe : une production
# en attente d'approbation ne bloque pas les publications de test suivantes.

jobs:
  verifier:
    uses: ./.github/workflows/verifier.yml

  construire:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer les outils (Rokit)
        uses: ./.github/actions/outils
      - run: wally install
      # La carte publiée est la carte vérifiée : on la régénère avant de construire.
      - name: Génération de la carte
        run: lune run outils/monde/generer.luau
      - name: Construction Rojo
        run: |
          mkdir -p build
          rojo build default.project.json -o build/jeu.rbxl
      - uses: actions/upload-artifact@v4
        with:
          name: jeu-rbxl
          path: build/jeu.rbxl
          if-no-files-found: error

  publier-test:
    needs: construire
    # Environnement « test » : il porte la clé Open Cloud de l'expérience de test.
    environment: test
    concurrency:
      group: publier-test
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: jeu-rbxl
          path: build
      - name: Publier sur l'expérience de test
        run: node outils/publier.mjs test build/jeu.rbxl
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}

  publier-prod:
    needs: publier-test
    # L'environnement protégé demande l'approbation de l'étudiant avant de démarrer ce job.
    environment: production
    concurrency:
      group: publier-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: jeu-rbxl
          path: build
      - name: Publier en production
        run: node outils/publier.mjs prod build/jeu.rbxl
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
